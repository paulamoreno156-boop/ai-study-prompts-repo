name: Daily Update
on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 BRT todo dia
  workflow_dispatch:

jobs:
  daily-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "# Atualizado em $(date '+%d/%m/%Y')" > .last-update.md
          git config user.name "Paula Moreno Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: daily update"
          git push