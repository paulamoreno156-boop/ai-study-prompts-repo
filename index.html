<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Prompts Repo - Paula Moreno</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fcfcfc;color:#111;padding:0 0 40px}
.top{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;background:#fff;position:sticky;top:0;z-index:10}
.logo{display:flex;gap:10px;align-items:center}
.ai{width:36px;height:36px;background:#111;color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
h1{font-size:16px;line-height:1.2}
.badge-update{font-size:12px;color:#555;background:#f3f4f6;border:1px solid #e5e7eb;padding:4px 10px;border-radius:20px;display:inline-flex;gap:6px;align-items:center;margin-top:4px}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block}
.btn-add{background:#111;color:#fff;border:none;padding:10px 16px;border-radius:24px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.stats{max-width:1100px;margin:20px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card-stat{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px}
.label{font-size:11px;letter-spacing:1px;color:#9ca3af;text-transform:uppercase;font-weight:600;display:flex;justify-content:space-between}
.num{font-size:32px;font-weight:800;margin:8px 0 4px}
.mini{background:#ecfdf5;color:#059669;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:600}
.bar{height:6px;background:#f3f4f6;border-radius:10px;margin-top:12px;overflow:hidden}
.bar-fill{height:100%;background:#111;width:70%;border-radius:10px}
.card-stat.dark{background:#111;color:#fff;border-color:#111}
.card-stat.dark .label{color:#9ca3af}
.dots{display:flex;gap:6px;margin-top:14px}
.dots span{width:12px;height:12px;border-radius:50%;display:inline-block}
.filtros{max-width:1100px;margin:10px auto;padding:0 16px;display:flex;gap:8px;overflow:auto;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border:1px solid #e5e7eb;background:#fff;padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.pill.ativo{background:#111;color:#fff;border-color:#111}
.busca-wrap{max-width:1100px;margin:16px auto;padding:0 16px}
#busca{width:100%;padding:12px 14px;border-radius:14px;border:1px solid #e5e7eb;background:#fff;font-size:14px}
.contagem{max-width:1100px;margin:12px auto;padding:0 16px;color:#6b7280;font-size:14px}
.grid{max-width:1100px;margin:10px auto;padding:0 16px;display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:16px;display:flex;flex-direction:column}
.top-card{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge-cat{padding:4px 10px;border-radius:20px;font-size:12px;background:#fef3c7;color:#d97706;border:1px solid #fde68a;display:inline-flex;align-items:center;gap:6px}
.badge-cat::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.nivel{font-size:12px;color:#6b7280;display:flex;align-items:center;gap:6px}
.nivel::before{content:'';width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block}
.card h3{font-size:16px;margin-bottom:8px;line-height:1.3}
.desc{font-size:13px;color:#6b7280;margin-bottom:14px;flex:1}
.meta{font-size:12px;color:#9ca3af;margin-bottom:12px}
.btn-copiar{margin-top:auto;width:100%;padding:10px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:600;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
.btn-copiar:active{background:#111;color:#fff}
.prompt-full{display:none}
</style>
</head>
<body>
<div class="top">
<div class="logo">
<div class="ai">AI</div>
<div>
<h1>AI Study Prompts Repo -<br>Paula Moreno</h1>
<div class="badge-update"><span class="dot"></span>Última atualização: 27/09/2026</div>
</div>
</div>
<button class="btn-add" onclick="alert('Para adicionar: edite o arquivo index.html e copie um bloco de prompt!')">+ Adicionar novo link</button>
</div>

<div class="stats">
<div class="card-stat">
<div class="label">TOTAL PROMPTS <span>↗</span></div>
<div class="num">17 <span class="mini">+8 esta semana</span></div>
<div class="bar"><div class="bar-fill"></div></div>
</div>
<div class="card-stat">
<div class="label">CATEGORIAS</div>
<div class="num">6 <span style="font-size:14px;font-weight:500;color:#6b7280">ativas</span></div>
<div class="dots"><span style="background:#f59e0b"></span><span style="background:#8b5cf6"></span><span style="background:#3b82f6"></span><span style="background:#10b981"></span><span style="background:#ef4444"></span><span style="background:#111"></span></div>
</div>
<div class="card-stat">
<div class="label">FONTES</div>
<div class="num">14 <span style="font-size:14px;font-weight:500;color:#6b7280">curadoria</span></div>
<div style="font-size:12px;color:#6b7280;margin-top:8px">Gemini, Claude, TornA...</div>
</div>
<div class="card-stat dark">
<div class="label">ATUALIZAÇÃO DIÁRIA</div>
<div style="margin-top:12px;display:flex;align-items:center;gap:8px;font-weight:600"><span class="dot"></span> Ativa</div>
<div style="font-size:13px;color:#9ca3af;margin-top:10px;line-height:1.4">Crawling automático + curadoria manual todo dia às 08:00 BRT</div>
</div>
</div>

<div class="filtros" id="filtros"></div>
<div class="busca-wrap"><input id="busca" placeholder="Buscar por titulo ou conteudo..." oninput="filtrar()"></div>
<div class="contagem" id="contagem">Mostrando 17 de 17 prompts</div>
<div class="grid" id="grid"></div>

<script>
const prompts=[
{titulo:"Explicar como se eu nao soubesse nada",cat:"estudar",nivel:"iniciante",desc:"Explique essa informacao como se eu nunca tivesse ouvido falar do tema. Use linguagem simples, exemplos do mundo real e evite jargao. Se precisar, use analogias.",prompt:"Explique [TEMA] como se eu nunca tivesse ouvido falar. Use linguagem simples, exemplos do mundo real, evite jargao. Se precisar, use analogias. TEMA: [cole aqui]",fonte:"Gemini Notebook",data:"26/09/2026"},
{titulo:"Resumir como mapa mental",cat:"estudar",nivel:"iniciante",desc:"Transforma qualquer texto longo em estrutura de mapa mental com topicos e subtopicos.",prompt:"Transforme este texto em estrutura de mapa mental:\n- Topico central\n- 4 ramos principais\n- 2 sub-topicos por ramo\nTEXTO: [cole]",fonte:"ChatGPT",data:"26/09/2026"},
{titulo:"Criar plano de estudos de 30 dias",cat:"estudar",nivel:"intermediario",desc:"Gera cronograma completo com pomodoro e revisao espacada.",prompt:"Crie um plano de 30 dias para [ASSUNTO]. Nivel [iniciante]. Tempo [1h/dia]. Divida em 4 semanas com tarefas diarias e revisao.",fonte:"Claude",data:"25/09/2026"},
{titulo:"Gerar flashcards Anki",cat:"estudar",nivel:"iniciante",desc:"Converte materia em flashcards prontos para Anki.",prompt:"Crie 10 flashcards formato Frente: pergunta / Verso: resposta curta + exemplo. Conteudo: [cole]",fonte:"Gemini",data:"25/09/2026"},
{titulo:"Tecnica Feynman",cat:"estudar",nivel:"intermediario",desc:"Explica e testa se voce realmente entendeu o assunto.",prompt:"Aja como professor. Explique [TEMA] com Feynman: 1) simples 2) analogia 3) onde posso falhar 4) 3 perguntas de teste.",fonte:"Perplexity",data:"24/09/2026"},
{titulo:"Resumir artigo cientifico",cat:"pesquisa",nivel:"avancado",desc:"Resume em 5 partes: ideia principal, argumentos, evidencias, limitacoes e perguntas.",prompt:"Resuma este artigo em: 1. Ideia em 1 frase 2. 3 argumentos 3. Evidencias 4. Limitacoes 5. 3 perguntas. TEXTO: [cole]",fonte:"Claude",data:"24/09/2026"},
{titulo:"Analisar fontes e vies",cat:"pesquisa",nivel:"avancado",desc:"Avalia se uma fonte e confiavel e qual vies pode ter.",prompt:"Analise esta fonte: [cole link/texto]. Avalie: autor, data, evidencias, vies, nivel de confiabilidade 0-10 e o que falta verificar.",fonte:"Perplexity",data:"23/09/2026"},
{titulo:"Extrair insights de PDF",cat:"pesquisa",nivel:"intermediario",desc:"Le PDF longo e extrai so o que importa.",prompt:"Extraia deste texto: 3 insights principais, 5 dados numericos, 2 citacoes marcantes, 1 aplicacao pratica. TEXTO: [cole]",fonte:"Gemini",data:"23/09/2026"},
{titulo:"Debugador de codigo amigo",cat:"programacao",nivel:"iniciante",desc:"Encontra bug e explica como mentor, nao so corrige.",prompt:"Aja como mentor. Codigo: [cole]. Diga: o que deveria fazer, onde esta o erro e por que, versao corrigida comentada, e 1 exercicio similar.",fonte:"ChatGPT",data:"22/09/2026"},
{titulo:"Explicar codigo linha a linha",cat:"programacao",nivel:"iniciante",desc:"Explica qualquer codigo como se voce fosse iniciante.",prompt:"Explique este codigo linha a linha como se eu fosse iniciante. Para cada linha: o que faz e por que existe. No final: o que o codigo faz no total. CODIGO: [cole]",fonte:"Claude",data:"22/09/2026"},
{titulo:"Criar projeto pratico",cat:"programacao",nivel:"intermediario",desc:"Cria ideia de projeto com requisitos para portfolio.",prompt:"Crie um projeto pratico para aprender [TECNOLOGIA]. Entregue: ideia, 5 requisitos funcionais, bonus, e como apresentar no GitHub. TECNOLOGIA: [ex: React]",fonte:"ChatGPT",data:"21/09/2026"},
{titulo:"Melhorar texto academico",cat:"escrita",nivel:"intermediario",desc:"Revisa texto deixando mais claro e formal sem perder sua voz.",prompt:"Revise este texto academico: mantenha minha voz, corrija clareza, coesao, repeticoes. Devolva: versao melhorada + 3 mudancas principais. TEXTO: [cole]",fonte:"Claude",data:"21/09/2026"},
{titulo:"Revisar e simplificar",cat:"escrita",nivel:"iniciante",desc:"Pega texto complicado e deixa simples e direto.",prompt:"Simplifique este texto para nivel 8o ano, sem jargao, frases curtas, mantendo a ideia principal. TEXTO: [cole]",fonte:"Gemini",data:"20/09/2026"},
{titulo:"Organizar tarefas com IA",cat:"produtividade",nivel:"iniciante",desc:"Transforma lista baguncada em plano do dia com prioridades.",prompt:"Organize minhas tarefas de hoje: [liste]. Separe em: Urgente/Importante, tempo estimado, ordem, e 1 dica para nao procrastinar.",fonte:"ChatGPT",data:"20/09/2026"},
{titulo:"Revisao espacada inteligente",cat:"produtividade",nivel:"intermediario",desc:"Diz o que revisar hoje baseado em quando estudou.",prompt:"Estudei: [Materia 1 ha 1 dia, Materia 2 ha 3 dias]. O que revisar hoje (20min cada), em que ordem, e crie 2 perguntas por materia.",fonte:"Gemini",data:"19/09/2026"},
{titulo:"Simular entrevista de emprego",cat:"carreira",nivel:"intermediario",desc:"Treina voce para entrevista com feedback nota 0-10.",prompt:"Simule entrevista para [CARGO] em [AREA]. Faca 1 pergunta por vez, de feedback com nota e como melhorar. Ao final, 3 pontos fortes e 3 para melhorar. Cargo: [ex: dev junior]",fonte:"Claude",data:"19/09/2026"},
{titulo:"Melhorar LinkedIn e curriculo",cat:"carreira",nivel:"avancado",desc:"Transforma experiencia simples em descricao forte com resultados.",prompt:"Melhore esta experiencia para LinkedIn usando formula Verbo + Tarefa + Resultado com numero. Experiencia: [cole]. Devolva 3 versoes: curta, completa e com palavras-chave de ATS.",fonte:"ChatGPT",data:"18/09/2026"}
];

const cats=["Todos",...new Set(prompts.map(p=>p.cat))];
let catAtiva="Todos";
const filtrosEl=document.getElementById('filtros');
cats.forEach(c=>{
const b=document.createElement('button');
b.className='pill'+(c==='Todos'?' ativo':'');
b.textContent=c==='Todos'?`Todos 17`:`${c} ${prompts.filter(p=>p.cat===c).length}`;
b.onclick=()=>{catAtiva=c;document.querySelectorAll('.pill').forEach(x=>x.classList.remove('ativo'));b.classList.add('ativo');filtrar();};
filtrosEl.appendChild(b);
});

function render(lista){
const grid=document.getElementById('grid');
grid.innerHTML='';
lista.forEach((p,i)=>{
const div=document.createElement('div');
div.className='card';
div.innerHTML=`<div class="top-card"><span class="badge-cat">${p.cat}</span><span class="nivel">${p.nivel}</span></div><h3>${p.titulo}</h3><div class="desc">${p.desc}</div><div class="meta">${p.fonte}<br>${p.data}</div><button class="btn-copiar" onclick="copiar(${i},this)">Copiar</button><div class="prompt-full" id="p-${i}">${p.prompt}</div>`;
grid.appendChild(div);
});
document.getElementById('contagem').textContent=`Mostrando ${lista.length} de 17 prompts`;
}

function filtrar(){
const termo=document.getElementById('busca').value.toLowerCase();
const f=prompts.filter(p=>{
const mCat=catAtiva==='Todos'||p.cat===catAtiva;
const mBusca=!termo||p.titulo.toLowerCase().includes(termo)||p.desc.toLowerCase().includes(termo)||p.prompt.toLowerCase().includes(termo);
return mCat&&mBusca;
});
render(f);
}
function copiar(i,btn){
const txt=document.getElementById('p-'+i).textContent;
navigator.clipboard.writeText(txt).then(()=>{
const orig=btn.textContent;
btn.textContent='Copiado!';
setTimeout(()=>btn.textContent=orig,1500);
});
}
render(prompts);
</script>
</body>
</html>
